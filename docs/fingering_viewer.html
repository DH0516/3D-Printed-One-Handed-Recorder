<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>One-Handed Recorder Fingerings</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --panel-2: #eef3f6;
        --text: #172026;
        --muted: #60717c;
        --line: #d9e1e6;
        --accent: #146c78;
        --accent-2: #9b2f36;
        --closed: #11181c;
        --open: #ffffff;
        --half: #2f6f82;
        --tube-light: #f5e4c3;
        --tube-mid: #e1c09f;
        --tube-dark: #c0946b;
        --shadow: 0 14px 38px rgba(23, 32, 38, 0.12);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        padding: 18px;
        background: #202b32;
        color: #f8fafb;
        border-right: 1px solid #10181d;
      }

      .brand {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.2;
        font-weight: 740;
      }

      .source {
        margin: 6px 0 0;
        color: #b9c6cc;
        font-size: 0.78rem;
        line-height: 1.35;
      }

      .icon-button {
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 7px;
        color: #f8fafb;
        background: rgba(255, 255, 255, 0.08);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .sidebar select {
        width: 100%;
        padding: 6px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }

      .sidebar label {
        font-size: 0.85rem;
        color: #b9c6cc;
        display: block;
      }

      .search {
        width: 100%;
        min-width: 0;
        height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        padding: 0 12px;
        outline: none;
        margin-bottom: 12px;
      }

      .legend {
        display: grid;
        gap: 8px;
        margin: 14px 0 16px;
        color: #dbe5e9;
        font-size: 0.8rem;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }

      .legend .hole {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
      }

      .note-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
        gap: 8px;
        padding-bottom: 18px;
      }

      .note-button {
        min-height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 7px;
        padding: 7px 8px;
        background: rgba(255, 255, 255, 0.07);
        color: #f8fafb;
        cursor: pointer;
        text-align: left;
      }

      .note-button.active {
        border-color: #6ed0db;
        background: rgba(20, 108, 120, 0.55);
      }

      .note-main {
        display: block;
        font-weight: 750;
        line-height: 1.1;
      }

      main {
        padding: 22px;
      }

      .detail {
        display: grid;
        grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
        gap: 18px;
        margin-bottom: 22px;
      }

      .detail-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        min-height: 500px;
      }

      .selected-note {
        font-size: 2.65rem;
        margin: 0 0 20px;
      }

      .diagram {
        --hole-size: 30px;
        --key-width: 44px;
        position: relative;
        display: grid;
        gap: 17px;
        justify-items: center;
        padding: 20px;
      }

      .hole-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .hole {
        width: var(--hole-size);
        height: var(--hole-size);
        border-radius: 50%;
        border: 2px solid #171f24;
        background: var(--open);
      }

      .hole.closed {
        background: var(--closed);
      }

      .hole.half {
        background: linear-gradient(
          90deg,
          var(--half) 0 50%,
          var(--open) 50% 100%
        );
      }

      .hole.key {
        width: var(--key-width);
        height: 24px;
        border-radius: 4px;
      }

      .hole-label {
        width: 60px;
        font-size: 0.85rem;
        text-align: right;
      }

      .table-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(164px, 1fr));
        gap: 12px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
        cursor: pointer;
      }

      .card.active {
        border-color: var(--accent);
        box-shadow: 0 10px 24px rgba(20, 108, 120, 0.13);
      }

      /* Print Styles */
      @media print {
        body {
          background: white;
          color: black;
        }
        .sidebar,
        .print-hide {
          display: none !important;
        }
        .app {
          display: block;
        }
        main {
          padding: 0;
        }
        .detail-panel,
        .table-panel {
          border: none;
          box-shadow: none;
          padding: 0;
          min-height: auto;
        }
        .cards {
          grid-template-columns: repeat(4, 1fr);
          gap: 10px;
          page-break-inside: auto;
        }
        .card {
          page-break-inside: avoid;
          border: 1px solid #ccc;
          padding: 8px;
        }
        .diagram {
          transform: scale(0.8);
          transform-origin: top center;
          gap: 10px;
        }
        @page {
          margin: 1.5cm;
        }
      }
    </style>
  </head>

    <script>
      // One entry per recorder model. The viewer renders whatever holes and
      // fingerings the model data provides, so models with different key or
      // hole configurations need no viewer changes, only an entry here.
      const MODELS = [
        { id: "A1", label: "Soprano A1 (standard)" },
        { id: "A2", label: "Soprano A2 (octave key at back)" },
      ];

      let state = {
        holes: [],
        notes: [],
        selectedId: null,
        query: "",
        notation: "standard",
        display: "text",
      };

      const solfegeMap = {
        C: "Do",
        "C#": "Di",
        Db: "Ra",
        D: "Re",
        "D#": "Ri",
        Eb: "Me",
        E: "Mi",
        F: "Fa",
        "F#": "Fi",
        Gb: "Se",
        G: "Sol",
        "G#": "Si",
        Ab: "Le",
        A: "La",
        "A#": "Li",
        Bb: "Te",
        B: "Ti",
      };

      function getNoteDisplayName(mainName) {
        if (state.notation === "standard") return mainName;

        const match = mainName.match(/^([A-G][#b]?)(.*)$/);
        if (match) {
          const note = match[1];
          const suffix = match[2] ? " " + match[2] : "";
          let normalizedNote = note;
          if (note.length > 1) {
            normalizedNote = note[0] + note[1].toLowerCase();
          }
          const solfege = solfegeMap[normalizedNote] || note;
          return `${solfege}${suffix}`;
        }
        return mainName;
      }

      // Scientific note names: letter, optional accidental, octave digit
      // ("C5", "G#6"). The octave drives the staff position.
      function parseNote(noteName) {
        const sci = noteName.match(/^([A-G])([#b]?)(\d)$/i);
        if (sci) {
          return {
            letter: sci[1].toUpperCase(),
            accidental: sci[2],
            octave: parseInt(sci[3], 10),
          };
        }
        const words = noteName.match(/^(Low|Mid|High)?\s*([A-G])([#b]?)$/i);
        if (words) {
          const register = (words[1] || "low").toLowerCase();
          const octave = register === "low" ? 5 : register === "mid" ? 6 : 7;
          return {
            letter: words[2].toUpperCase(),
            accidental: words[3],
            octave,
          };
        }
        return null;
      }

      function createStaffSVG(noteName, sizeMode = "large") {
        const n = parseNote(noteName);
        if (!n)
          return `<span class="note-main">${getNoteDisplayName(noteName)}</span>`;

        const stepMap = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
        const stepsFromC4 = (n.octave - 4) * 7 + stepMap[n.letter];

        const c4Y = 80;
        const stepHeight = 5;
        const noteY = c4Y - stepsFromC4 * stepHeight;

        let svgWidth, svgHeight;
        if (sizeMode === "mini") {
          svgWidth = "100%";
          svgHeight = "32px";
        } else if (sizeMode === "card") {
          svgWidth = "100%";
          svgHeight = "50px";
        } else {
          svgWidth = "120px";
          svgHeight = "100px";
        }

        let svg = `<svg width="${svgWidth}" height="${svgHeight}" viewBox="0 10 120 90" style="display:block; margin:auto; overflow:visible;">
        <path d="M 10 30 L 110 30 M 10 40 L 110 40 M 10 50 L 110 50 M 10 60 L 110 60 M 10 70 L 110 70" stroke="currentColor" stroke-width="1"/>
        <text x="15" y="65" font-size="40" font-family="serif" fill="currentColor">𝄞</text>
      `;

        if (noteY >= 80) {
          for (let y = 80; y <= noteY; y += 10)
            svg += `<line x1="55" y1="${y}" x2="85" y2="${y}" stroke="currentColor" stroke-width="1.5"/>`;
        } else if (noteY <= 20) {
          for (let y = 20; y >= noteY; y -= 10)
            svg += `<line x1="55" y1="${y}" x2="85" y2="${y}" stroke="currentColor" stroke-width="1.5"/>`;
        }

        svg += `<ellipse cx="70" cy="${noteY}" rx="6" ry="4.5" fill="currentColor" transform="rotate(-15 70 ${noteY})"/>`;

        if (n.accidental) {
          svg += `<text x="45" y="${noteY + 5}" font-size="16" font-family="sans-serif" fill="currentColor">${n.accidental}</text>`;
        }

        if (noteY > 50) {
          svg += `<line x1="75.5" y1="${noteY}" x2="75.5" y2="${noteY - 30}" stroke="currentColor" stroke-width="1.5"/>`;
        } else {
          svg += `<line x1="64.5" y1="${noteY}" x2="64.5" y2="${noteY + 30}" stroke="currentColor" stroke-width="1.5"/>`;
        }

        svg += `</svg>`;
        return svg;
      }

      function getNoteDisplayHTML(noteName, context = "list") {
        if (state.display === "staff") {
          if (context === "list") return createStaffSVG(noteName, "mini");
          if (context === "card") return createStaffSVG(noteName, "card");
        }
        return `<span class="note-main">${getNoteDisplayName(noteName)}</span>`;
      }

      function applyModel(json, sourceLabel) {
        if (json.schema !== "ohr-model/1") {
          throw new Error("unrecognized model data");
        }
        state.holes = json.holes.map((h, i) => ({
          id: h.id,
          name: h.key || "Hole " + h.id,
          isKey: h.type === "key",
          index: i,
        }));
        state.notes = json.fingerings.map((f, i) => ({
          id: i,
          main: f.note,
          values: state.holes.map((h) => (f.holes[h.id] || "").trim()),
        }));
        state.layout = Array.isArray(json.layout) ? json.layout : null;
        if (state.notes.length === 0) throw new Error("no fingerings in model");
        state.selectedId = 0;
        document.getElementById("modelLabel").textContent = sourceLabel;
        render();
      }

      async function loadModel(id) {
        try {
          // Embedded data first: the page works from any static host or
          // opened directly from disk, with no fetching at all.
          const embedded = document.getElementById("model-data-" + id);
          if (embedded) {
            const json = JSON.parse(embedded.textContent);
            applyModel(json, json.name);
            return;
          }
          const response = await fetch(`../models/${id}/model.json`);
          if (!response.ok) throw new Error("HTTP " + response.status);
          const json = await response.json();
          applyModel(json, json.name);
        } catch (e) {
          console.error("Failed to load model", e);
          document.getElementById("selectedNote").textContent =
            "Error: " + e.message;
          document.getElementById("diagram").innerHTML =
            "<p>Could not load the model data for this model.</p>";
        }
      }

      // Simplified instrument diagram: a recorder silhouette with the key
      // touchpieces (Keys 1 to 4) above the finger holes (5 to 8), spaced
      // evenly in model order. No real dimensions are used.
      function buildInstrumentSVG(note) {
        const cx = 110;
        let stations = [];
        let used = new Set();
        state.holes.forEach((h, i) => {
          if (used.has(i)) return;
          const match = h.id.match(/^(.+?)([LR])$/);
          if (match) {
            const base = match[1];
            const partner = state.holes.findIndex(
              (other, j) =>
                j !== i && !used.has(j) && other.id === base + (match[2] === "L" ? "R" : "L"),
            );
            if (partner !== -1) {
              stations.push({
                label: "Hole " + base,
                type: "pair",
                holes: [h, state.holes[partner]],
              });
              used.add(i);
              used.add(partner);
              return;
            }
          }
          stations.push({ label: h.name, type: h.isKey ? "key" : "hole", holes: [h] });
          used.add(i);
        });

        // Diagram order comes from the model's layout list when present
        // (station ids top to bottom; a double hole is its base id).
        stations.forEach((st) => {
          st.key = st.type === "pair"
            ? st.holes[0].id.replace(/[LR]$/, "")
            : st.holes[0].id;
        });
        if (state.layout) {
          const ordered = state.layout
            .map((e) => stations.find((s) => s.key === e))
            .filter(Boolean);
          if (ordered.length === stations.length) stations = ordered;
        }

        const y0 = 150;
        const y1 = 520;
        const gap = stations.length > 1 ? (y1 - y0) / (stations.length - 1) : 0;
        const fillFor = (v) =>
          v === "C" ? "#11181c" : v === "H" ? "url(#halfGrad)" : "#ffffff";

        let marks = "";
        stations.forEach((st, i) => {
          const y = y0 + i * gap;
          const v1 = (note.values[st.holes[0].index] || "").toUpperCase();
          if (st.type === "key") {
            marks += `<rect x="${cx - 18}" y="${y - 6}" width="36" height="12" rx="5" fill="${fillFor(v1)}" stroke="#171f24" stroke-width="2"/>`;
          } else if (st.type === "pair") {
            const v2 = (note.values[st.holes[1].index] || "").toUpperCase();
            marks += `<circle cx="${cx - 8}" cy="${y}" r="6.5" fill="${fillFor(v1)}" stroke="#171f24" stroke-width="2"/>`;
            marks += `<circle cx="${cx + 8}" cy="${y}" r="6.5" fill="${fillFor(v2)}" stroke="#171f24" stroke-width="2"/>`;
          } else {
            marks += `<circle cx="${cx}" cy="${y}" r="8" fill="${fillFor(v1)}" stroke="#171f24" stroke-width="2"/>`;
          }
          marks += `<text x="${cx - 30}" y="${y + 4}" text-anchor="end" font-size="13" fill="#172026">${st.label}</text>`;
        });

        return `<svg width="100%" viewBox="0 0 220 640" style="max-width:260px; display:block; margin:0 auto;" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="halfGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="50%" stop-color="#2f6f82"/>
              <stop offset="50%" stop-color="#ffffff"/>
            </linearGradient>
          </defs>
          <!-- head joint -->
          <rect x="${cx - 13}" y="18" width="26" height="86" rx="10" fill="#f5e4c3" stroke="#8a6f4d" stroke-width="2"/>
          <rect x="${cx - 6}" y="42" width="12" height="22" rx="3" fill="#ffffff" stroke="#8a6f4d" stroke-width="1.5"/>
          <!-- body and foot -->
          <path d="M ${cx - 12} 104 L ${cx - 12} 528 L ${cx - 13} 540 L ${cx - 21} 596 L ${cx + 21} 596 L ${cx + 13} 540 L ${cx + 12} 528 L ${cx + 12} 104 Z" fill="#f5e4c3" stroke="#8a6f4d" stroke-width="2"/>
          <line x1="${cx - 12}" y1="104" x2="${cx + 12}" y2="104" stroke="#8a6f4d" stroke-width="1.5"/>
          <line x1="${cx - 12.5}" y1="534" x2="${cx + 12.5}" y2="534" stroke="#8a6f4d" stroke-width="1.5"/>
          <!-- bell opening -->
          <ellipse cx="${cx}" cy="596" rx="21" ry="6" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/>
          ${marks}
        </svg>`;
      }

      function render() {
        const q = state.query.toLowerCase();
        const visible = state.notes.filter(
          (n) =>
            getNoteDisplayName(n.main).toLowerCase().includes(q) ||
            n.main.toLowerCase().includes(q),
        );

        const list = document.getElementById("noteList");
        list.innerHTML = visible
          .map(
            (n) =>
              `<button class="note-button ${n.id === state.selectedId ? "active" : ""}" onclick="selectNote(${n.id})" style="display:flex; align-items:center; justify-content:center;">${getNoteDisplayHTML(n.main, "list")}</button>`,
          )
          .join("");

        const cards = document.getElementById("cards");
        cards.innerHTML = visible
          .map(
            (n) =>
              `<div class="card ${n.id === state.selectedId ? "active" : ""}" onclick="selectNote(${n.id})" style="text-align:center; display:flex; flex-direction:column; justify-content:center;"><strong>${getNoteDisplayHTML(n.main, "card")}</strong></div>`,
          )
          .join("");

        const note = state.notes.find((n) => n.id === state.selectedId);
        if (note) {
          document.getElementById("selectedNote").textContent =
            getNoteDisplayName(note.main);
          document.getElementById("staffContainer").innerHTML = createStaffSVG(
            note.main,
            "large",
          );

          document.getElementById("diagram").innerHTML = buildInstrumentSVG(note);

          document.getElementById("stateRows").innerHTML = state.holes
            .map((h) => {
              const val = (note.values[h.index] || "").toUpperCase();
              const stateName =
                val === "C" ? "Closed" : val === "H" ? "Half" : "Open";
              return `<tr><td>${h.name}</td><td>${stateName}</td></tr>`;
            })
            .join("");
        }
      }

      function selectNote(id) {
        state.selectedId = id;
        render();
      }

      document.getElementById("searchInput").addEventListener("input", (e) => {
        state.query = e.target.value;
        render();
      });

      document
        .getElementById("notationToggle")
        .addEventListener("change", (e) => {
          state.notation = e.target.value;
          render();
        });

      document
        .getElementById("displayToggle")
        .addEventListener("change", (e) => {
          state.display = e.target.value;
          render();
        });

      const modelSelect = document.getElementById("modelSelect");
      modelSelect.innerHTML = MODELS.map(
        (m) => `<option value="${m.id}">${m.label}</option>`,
      ).join("");
      modelSelect.addEventListener("change", (e) => {
        loadModel(e.target.value);
      });

      document.getElementById("fileBtn").addEventListener("click", () => {
        document.getElementById("fileInput").click();
      });

      document
        .getElementById("fileInput")
        .addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const json = JSON.parse(await file.text());
            applyModel(json, file.name + " (local file)");
          } catch (err) {
            document.getElementById("selectedNote").textContent =
              "Error: " + err.message;
          }
        });

      loadModel(MODELS[0].id);
    </script>
  </body>
</html>

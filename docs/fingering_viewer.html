<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>One-Handed Recorder Fingerings</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f1ede2;
        --panel: #fdfcf7;
        --ink: #22292d;
        --muted: #68747d;
        --line: #e3dccc;
        --accent: #0e6f66;
        --accent-ink: #0a5049;
        --accent-soft: rgba(14, 111, 102, 0.1);
        --brass: #a87f27;
        --rail: #1f2a27;
        --rail-deep: #18211e;
        --rail-text: #edf2ee;
        --rail-muted: #93a69e;
        --rail-line: rgba(255, 255, 255, 0.12);
        --closed: #1d2428;
        --open: #ffffff;
        --half: #0e6f66;
        --shadow:
          0 1px 2px rgba(34, 41, 45, 0.05),
          0 16px 40px rgba(34, 41, 45, 0.09);
        --radius: 14px;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
          serif;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }

      button,
      input,
      select {
        font: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 2px;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: var(--sidebar-w, 300px) 6px minmax(0, 1fr);
      }

      .resizer {
        cursor: col-resize;
        position: relative;
        touch-action: none;
        user-select: none;
      }

      .resizer::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 2px;
        width: 2px;
        background: var(--line);
      }

      .resizer:hover::after,
      .resizer.active::after {
        background: var(--accent);
      }

      /* ---------- sidebar rail ---------- */

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        padding: 22px 18px 28px;
        background: linear-gradient(180deg, var(--rail) 0%, var(--rail-deep) 100%);
        color: var(--rail-text);
      }

      .brand {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--rail-line);
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: 1.35rem;
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .source {
        margin: 8px 0 0;
        color: var(--rail-muted);
        font-size: 0.78rem;
        line-height: 1.4;
      }

      .controls {
        display: grid;
        gap: 10px;
        margin-bottom: 18px;
      }

      .field {
        display: block;
      }

      .field-label {
        display: block;
        font-size: 0.7rem;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--rail-muted);
        margin-bottom: 4px;
      }

      .sidebar select {
        width: 100%;
        padding: 7px 8px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--rail-text);
        border: 1px solid var(--rail-line);
        border-radius: 8px;
      }

      .sidebar select option {
        color: var(--ink);
      }

      .btn {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid transparent;
        font-weight: 650;
        font-size: 0.88rem;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }

      .btn-accent {
        background: var(--accent);
        color: #ffffff;
      }

      .btn-accent:hover {
        background: var(--accent-ink);
      }

      .btn-ghost {
        background: transparent;
        border-color: var(--rail-line);
        color: var(--rail-text);
      }

      .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.07);
      }

      .search {
        width: 100%;
        min-width: 0;
        height: 40px;
        border: 1px solid var(--rail-line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--rail-text);
        padding: 0 12px;
        outline: none;
      }

      .search::placeholder {
        color: var(--rail-muted);
      }

      .search:focus {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.09);
      }

      .legend {
        display: grid;
        gap: 8px;
        margin: 0 0 16px;
        padding: 12px 0;
        border-top: 1px solid var(--rail-line);
        border-bottom: 1px solid var(--rail-line);
        color: var(--rail-muted);
        font-size: 0.8rem;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }

      .legend .hole {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
      }

      .note-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
      }

      .note-button {
        min-height: 40px;
        border: 1px solid transparent;
        border-radius: 9px;
        padding: 6px 4px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--rail-text);
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }

      .note-button:hover {
        background: rgba(255, 255, 255, 0.11);
      }

      .note-button.active {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.35);
        color: #ffffff;
      }

      .note-main {
        display: block;
        font-weight: 700;
        font-size: 0.9rem;
        line-height: 1.1;
      }

      /* ---------- main content ---------- */

      main {
        padding: 28px clamp(18px, 4vw, 44px) 48px;
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .detail {
        display: grid;
        grid-template-columns: minmax(280px, 380px) minmax(0, 1fr);
        gap: 20px;
        margin-bottom: 32px;
        align-items: start;
      }

      .detail-panel {
        padding: 22px 22px 28px;
      }

      .note-head {
        text-align: center;
        padding-bottom: 16px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }

      .selected-note {
        font-family: var(--serif);
        font-size: 3rem;
        font-weight: 600;
        line-height: 1;
        margin: 0;
        color: var(--accent-ink);
      }

      .staff-large {
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 6px;
      }

      .diagram {
        position: relative;
        display: grid;
        justify-items: center;
        padding: 14px 8px 4px;
      }

      .hole {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid #171f24;
        background: var(--open);
      }

      .hole.closed {
        background: var(--closed);
      }

      .hole.half {
        background: linear-gradient(
          90deg,
          var(--half) 0 50%,
          var(--open) 50% 100%
        );
      }

      /* ---------- state table ---------- */

      .table-panel {
        overflow: auto;
        max-height: 640px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      thead th {
        position: sticky;
        top: 0;
        background: var(--panel);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 2px solid var(--line);
      }

      th,
      td {
        padding: 11px 16px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      tbody tr:nth-child(even) {
        background: rgba(34, 41, 45, 0.025);
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      /* ---------- all fingerings ---------- */

      /* ---------- responsive ---------- */

      /* tablet: rail becomes a top section, controls go two-column */
      @media (max-width: 960px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: static;
          height: auto;
          padding: 18px clamp(16px, 4vw, 32px) 22px;
        }
        .brand {
          margin-bottom: 14px;
          padding-bottom: 12px;
        }
        .controls {
          grid-template-columns: 1fr 1fr;
          align-items: end;
        }
        .controls .search {
          grid-column: 1 / -1;
        }
        .legend {
          grid-template-columns: repeat(3, auto);
          justify-content: start;
          gap: 8px 20px;
        }
        .note-list {
          grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        }
        .detail {
          grid-template-columns: 1fr;
        }
        .table-panel {
          max-height: none;
        }
      }

      /* phones: single column throughout, tighter spacing */
      @media (max-width: 640px) {
        main {
          padding: 16px 12px 36px;
        }
        h1 {
          font-size: 1.15rem;
        }
        .controls {
          grid-template-columns: 1fr;
        }
        .legend {
          grid-template-columns: 1fr;
        }
        .note-list {
          grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
          gap: 6px;
        }
        .note-button {
          min-height: 36px;
        }
        .detail {
          gap: 14px;
          margin-bottom: 20px;
        }
        .detail-panel {
          padding: 16px 12px 20px;
        }
        .selected-note {
          font-size: 2.3rem;
        }
        .staff-large {
          height: 80px;
        }
        table {
          font-size: 0.85rem;
        }
        th,
        td {
          padding: 9px 12px;
        }
      }

      /* ---------- print ---------- */

      @media print {
        body {
          background: white;
          color: black;
        }
        .sidebar,
        .print-hide {
          display: none !important;
        }
        .app {
          display: block;
        }
        main {
          padding: 0;
          max-width: none;
        }
        .panel {
          border: none;
          box-shadow: none;
        }
        .detail-panel,
        .table-panel {
          padding: 0;
        }
        .diagram {
          transform: scale(0.8);
          transform-origin: top center;
        }
        @page {
          margin: 1.5cm;
        }
      }
    </style>
  </head>

note":"A5","holes":{"1":"C","2":"C","3":"C","4":"O","5":"O","6":"O","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"A#5","holes":{"1":"C","2":"C","3":"O","4":"C","5":"C","6":"O","7L":"C","7R":"C","8L":"O","8R":"O"}},{"note":"B5","holes":{"1":"C","2":"C","3":"O","4":"O","5":"O","6":"O","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"C6","holes":{"1":"C","2":"O","3":"C","4":"O","5":"O","6":"O","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"C#6","holes":{"1":"O","2":"C","3":"C","4":"O","5":"O","6":"O","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"D6","holes":{"1":"O","2":"O","3":"C","4":"O","5":"O","6":"O","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"D#6","holes":{"1":"O","2":"C","3":"C","4":"C","5":"C","6":"C","7L":"C","7R":"C","8L":"O","8R":"O"}},{"note":"E6","holes":{"1":"H","2":"C","3":"C","4":"C","5":"C","6":"C","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"F6","holes":{"1":"H","2":"C","3":"C","4":"C","5":"C","6":"O","7L":"C","7R":"C","8L":"O","8R":"O"}},{"note":"F#6","holes":{"1":"H","2":"C","3":"C","4":"C","5":"O","6":"C","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"G6","holes":{"1":"H","2":"C","3":"C","4":"C","5":"O","6":"O","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"G#6","holes":{"1":"H","2":"C","3":"C","4":"O","5":"C","6":"O","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"A6","holes":{"1":"H","2":"C","3":"C","4":"O","5":"O","6":"O","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"A#6","holes":{"1":"H","2":"C","3":"C","4":"O","5":"C","6":"C","7L":"C","7R":"C","8L":"O","8R":"O"}},{"note":"B6","holes":{"1":"H","2":"C","3":"C","4":"O","5":"C","6":"C","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"C7","holes":{"1":"H","2":"C","3":"O","4":"O","5":"C","6":"C","7L":"O","7R":"O","8L":"O","8R":"O"}},{"note":"C#7","holes":{"1":"H","2":"C","3":"O","4":"C","5":"C","6":"O","7L":"O","7R":"O","8L":"O","8R":"O"}}]}</script>

    <div class="app">

          <label class="field">

              <option value="simple" selected>Simple</option>

    <script>
      // One entry per recorder model. The viewer renders whatever holes and
      // fingerings the model data provides, so models with different key or
      // hole configurations need no viewer changes, only an entry here.
      const MODELS = [
        { id: "A1-2", label: "Soprano A1/2 (both variants)" },
      ];

      let state = {
        holes: [],
        notes: [],
        selectedId: null,
        query: "",
        notation: "simple",
        display: "text",
      };

      const solfegeMap = {
        C: "Do",
        "C#": "Di",
        Db: "Ra",
        D: "Re",
        "D#": "Ri",
        Eb: "Me",
        E: "Mi",
        F: "Fa",
        "F#": "Fi",
        Gb: "Se",
        G: "Sol",
        "G#": "Si",
        Ab: "Le",
        A: "La",
        "A#": "Li",
        Bb: "Te",
        B: "Ti",
      };

      function getNoteDisplayName(mainName) {
        // Simple: relative octaves, C5 is C1 (the instrument's lowest
        // note), so C5..C#7 read C1..C#3.
        if (state.notation === "simple") {
          const m = mainName.match(/^([A-G][#b]?)(\d)$/);
          if (m) return m[1] + (parseInt(m[2], 10) - 4);
          return mainName;
        }
        if (state.notation === "standard") return mainName;

        const match = mainName.match(/^([A-G][#b]?)(\d)$/);
        if (match) {
          const note = match[1];
          const octave = parseInt(match[2], 10) - 4;
          let normalizedNote = note;
          if (note.length > 1) {
            normalizedNote = note[0] + note[1].toLowerCase();
          }
          const solfege = solfegeMap[normalizedNote] || note;
          return `${solfege} ${octave}`;
        }
        return mainName;
      }

      // Scientific note names: letter, optional accidental, octave digit
      // ("C5", "G#6"). The octave drives the staff position.
      function parseNote(noteName) {
        const sci = noteName.match(/^([A-G])([#b]?)(\d)$/i);
        if (sci) {
          return {
            letter: sci[1].toUpperCase(),
            accidental: sci[2],
            octave: parseInt(sci[3], 10),
          };
        }
        const words = noteName.match(/^(Low|Mid|High)?\s*([A-G])([#b]?)$/i);
        if (words) {
          const register = (words[1] || "low").toLowerCase();
          const octave = register === "low" ? 5 : register === "mid" ? 6 : 7;
          return {
            letter: words[2].toUpperCase(),
            accidental: words[3],
            octave,
          };
        }
        return null;
      }

      function createStaffSVG(noteName, sizeMode = "large") {
        const n = parseNote(noteName);
        if (!n)
          return `<span class="note-main">${getNoteDisplayName(noteName)}</span>`;
        // All naming modes read the instrument's register, not absolute
        // pitch, so every staff note draws one octave lower: C5 (the
        // instrument's lowest C) sits at the C4 staff position.
        n.octave -= 1;

        const stepMap = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
        const stepsFromC4 = (n.octave - 4) * 7 + stepMap[n.letter];

        const c4Y = 80;
        const stepHeight = 5;
        const noteY = c4Y - stepsFromC4 * stepHeight;

        let svgWidth, svgHeight;
        if (sizeMode === "mini") {
          svgWidth = "100%";
          svgHeight = "32px";
        } else {
          svgWidth = "120px";
          svgHeight = "100px";
        }

        let svg = `<svg width="${svgWidth}" height="${svgHeight}" viewBox="0 10 120 90" style="display:block; margin:auto; overflow:visible;">
        <path d="M 10 30 L 110 30 M 10 40 L 110 40 M 10 50 L 110 50 M 10 60 L 110 60 M 10 70 L 110 70" stroke="currentColor" stroke-width="1"/>
        <text x="15" y="65" font-size="40" font-family="serif" fill="currentColor">𝄞</text>
      `;

        if (noteY >= 80) {
          for (let y = 80; y <= noteY; y += 10)
            svg += `<line x1="55" y1="${y}" x2="85" y2="${y}" stroke="currentColor" stroke-width="1.5"/>`;
        } else if (noteY <= 20) {
          for (let y = 20; y >= noteY; y -= 10)
            svg += `<line x1="55" y1="${y}" x2="85" y2="${y}" stroke="currentColor" stroke-width="1.5"/>`;
        }

        svg += `<ellipse cx="70" cy="${noteY}" rx="6" ry="4.5" fill="currentColor" transform="rotate(-15 70 ${noteY})"/>`;

        if (n.accidental) {
          svg += `<text x="45" y="${noteY + 5}" font-size="16" font-family="sans-serif" fill="currentColor">${n.accidental}</text>`;
        }

        if (noteY > 50) {
          svg += `<line x1="75.5" y1="${noteY}" x2="75.5" y2="${noteY - 30}" stroke="currentColor" stroke-width="1.5"/>`;
        } else {
          svg += `<line x1="64.5" y1="${noteY}" x2="64.5" y2="${noteY + 30}" stroke="currentColor" stroke-width="1.5"/>`;
        }

        svg += `</svg>`;
        return svg;
      }

      function getNoteDisplayHTML(noteName) {
        if (state.display === "staff") return createStaffSVG(noteName, "mini");
        return `<span class="note-main">${getNoteDisplayName(noteName)}</span>`;
      }

      // Display label only: finger holes 5 to 8 are labeled 1 to 4 in the
      // viewer. The data ids never change.
      function holeDisplay(id) {
        const m = id.match(/^(\d+)([LR]?)$/);
        if (m && parseInt(m[1], 10) >= 5) {
          return "Hole " + (parseInt(m[1], 10) - 4) + m[2];
        }
        return "Hole " + id;
      }

      function applyModel(json, sourceLabel) {
        if (json.schema !== "ohr-model/1") {
          throw new Error("unrecognized model data");
        }
        state.holes = json.holes.map((h, i) => ({
          id: h.id,
          name: h.key || holeDisplay(h.id),
          isKey: h.type === "key",
          index: i,
        }));
        state.notes = json.fingerings.map((f, i) => ({
          id: i,
          main: f.note,
          values: state.holes.map((h) => (f.holes[h.id] || "").trim()),
        }));
        state.layout = Array.isArray(json.layout) ? json.layout : null;
        if (state.notes.length === 0) throw new Error("no fingerings in model");
        state.selectedId = 0;
        document.getElementById("modelLabel").textContent = sourceLabel;
        render();
      }

      async function loadModel(id) {
        try {
          // Embedded data first: the page works from any static host or
          // opened directly from disk, with no fetching at all.
          const embedded = document.getElementById("model-data-" + id);
          if (embedded) {
            const json = JSON.parse(embedded.textContent);
            applyModel(json, json.name);
            return;
          }
          const response = await fetch(`../models/${id}/model.json`);
          if (!response.ok) throw new Error("HTTP " + response.status);
          const json = await response.json();
          applyModel(json, json.name);
        } catch (e) {
          console.error("Failed to load model", e);
          document.getElementById("selectedNote").textContent =
            "Error: " + e.message;
          document.getElementById("diagram").innerHTML =
            "<p>Could not load the model data for this model.</p>";
        }
      }

      // Instrument diagram: outer profile traced from a reference drawing
      // of a soprano recorder (123RF 67011402) by threshold extraction,
      // with the key touchpieces (Keys 1 to 4) and finger holes (5 to 8)
      // spaced evenly in model order along the body and foot. The hole
      // marks are stylized; the silhouette is measured, not invented.
      function buildInstrumentSVG(note) {
        const cx = 110;
        let stations = [];
        let used = new Set();
        state.holes.forEach((h, i) => {
          if (used.has(i)) return;
          const match = h.id.match(/^(.+?)([LR])$/);
          if (match) {
            const base = match[1];
            const partner = state.holes.findIndex(
              (other, j) =>
                j !== i && !used.has(j) && other.id === base + (match[2] === "L" ? "R" : "L"),
            );
            if (partner !== -1) {
              stations.push({
                label: holeDisplay(base),
                type: "pair",
                holes: [h, state.holes[partner]],
              });
              used.add(i);
              used.add(partner);
              return;
            }
          }
          stations.push({ label: h.name, type: h.isKey ? "key" : "hole", holes: [h] });
          used.add(i);
        });

        // Diagram order comes from the model's layout list when present
        // (station ids top to bottom; a double hole is its base id).

          st.key = st.type === "pair"
            ? st.holes[0].id.replace(/[LR]$/, "")
            : st.holes[0].id;
        });
        if (state.layout) {
          const ordered = state.layout
            .map((e) => stations.find((s) => s.key === e))
            .filter(Boolean);
          if (ordered.length === stations.length) stations = ordered;
        }

        const y0 = 279;
        const y1 = 522;
        const gap = stations.length > 1 ? (y1 - y0) / (stations.length - 1) : 0;
        const fillFor = (v) =>
          v === "C" ? "#11181c" : v === "H" ? "url(#halfGrad)" : "#ffffff";

        let marks = "";
        // Cosmetic inversion for all four keys: closed draws as open, and
        // open and half both draw as closed. Finger holes keep the normal
        // mapping. The fingering data itself never changes.
        const INVERTED_KEYS = new Set(["1", "2", "3", "4"]);
        stations.forEach((st, i) => {
          const y = y0 + i * gap;
          let v1 = (note.values[st.holes[0].index] || "").toUpperCase();
          if (st.type === "key" && INVERTED_KEYS.has(st.holes[0].id)) {
            v1 = v1 === "C" ? "O" : "C";
          }
          if (st.type === "key" && st.holes[0].id === "1") {
            marks += `<circle cx="${cx}" cy="${y}" r="7" fill="${fillFor(v1)}" stroke="#171f24" stroke-width="2"/>`;
          } else if (st.type === "key") {
            marks += `<rect x="${cx - 13}" y="${y - 5.5}" width="26" height="11" rx="5" fill="${fillFor(v1)}" stroke="#171f24" stroke-width="2"/>`;
          } else if (st.type === "pair") {
            const v2 = (note.values[st.holes[1].index] || "").toUpperCase();
            marks += `<circle cx="${cx - 5.5}" cy="${y}" r="5" fill="${fillFor(v1)}" stroke="#171f24" stroke-width="2"/>`;
            marks += `<circle cx="${cx + 5.5}" cy="${y}" r="5" fill="${fillFor(v2)}" stroke="#171f24" stroke-width="2"/>`;
          } else {
            marks += `<circle cx="${cx}" cy="${y}" r="6.5" fill="${fillFor(v1)}" stroke="#171f24" stroke-width="2"/>`;
          }
          marks += `<text x="${cx - 30}" y="${y + 4}" text-anchor="end" font-size="13" fill="#172026">${st.label}</text>`;
        });

        return `<svg width="100%" viewBox="0 0 220 640" style="max-width:260px; display:block; margin:0 auto;" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="halfGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="50%" stop-color="#0e6f66"/>

305.7 L 128.8 302.7 L 128.8 299.7 L 128.8 296.7 L 129.0 293.7 L 129.0 290.7 L 129.0 287.7 L 129.0 284.7 L 129.0 281.7 L 129.0 278.7 L 129.0 275.7 L 129.0 272.6 L 129.3 269.6 L 129.5 266.6 L 129.5 263.6 L 129.5 260.6 L 129.5 257.6 L 129.5 254.6 L 129.5 251.6 L 129.5 248.6 L 129.7 245.6 L 129.8 242.6 L 130.5 239.6 L 131.8 236.6 L 132.2 233.6 L 132.8 230.5 L 132.4 227.5 L 132.7 224.5 L 135.1 221.5 L 136.9 218.5 L 137.9 215.5 L 137.9 212.5 L 137.2 209.5 L 137.2 206.5 L 137.3 203.5 L 135.9 200.5 L 134.1 197.5 L 133.4 194.5 L 132.9 191.4 L 132.3 188.4 L 131.9 185.4 L 131.6 182.4 L 131.2 179.4 L 131.0 176.4 L 130.9 173.4 L 130.7 170.4 L 130.6 167.4 L 130.5 164.4 L 130.3 161.4 L 130.2 158.4 L 130.1 155.4 L 130.1 152.3 L 130.1 149.3 L 130.0 146.3 L 130.1 143.3 L 130.2 140.3 L 130.3 137.3 L 130.3 134.3 L 130.3 131.3 L 130.3 128.3 L 130.4 125.3 L 130.6 122.3 L 130.8 119.3 L 130.9 116.3 L 131.1 113.2 L 131.3 110.2 L 131.6 107.2 L 131.9 104.2 L 132.3 101.2 L 132.7 98.2 L 133.4 95.2 L 134.1 92.2 L 135.0 89.2 L 136.1 86.2 L 137.4 83.2 L 137.0 80.2 L 135.9 77.2 L 136.2 74.2 L 136.6 71.1 L 137.0 68.1 L 137.3 65.1 L 137.5 62.1 L 137.6 59.1 L 137.6 56.1 L 137.5 53.1 L 137.2 50.1 L 136.9 47.1 L 136.4 44.1 L 135.8 41.1 L 135.1 38.1 L 134.3 35.1 L 133.3 32.0 L 132.2 29.0 L 130.9 26.0 L 129.5 23.0 L 128.0 20.0 L 126.5 17.0 L 125.1 14.0 Z" fill="url(#woodGrad)" stroke="#7d6242" stroke-width="2"/>
          <!-- window: arched top, dark (traced position y 71-101) -->
          <path d="M ${cx - 7} 101 L ${cx - 7} 82 Q ${cx - 7} 74 ${cx} 74 Q ${cx + 7} 74 ${cx + 7} 82 L ${cx + 7} 101 Z" fill="#3a2d1c" stroke="#7d6242" stroke-width="1"/>
          <!-- joint seams: head/body at 224, body/foot at 495 -->
          <line x1="${cx - 19}" y1="224" x2="${cx + 19}" y2="224" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>
          <line x1="${cx - 18}" y1="495" x2="${cx + 18}" y2="495" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>
          <!-- sheen highlight -->
          <line x1="${cx - 6}" y1="235" x2="${cx - 6}" y2="480" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
          ${marks}
        </svg>`;
      }

      function render() {
        const q = state.query.toLowerCase();
        const visible = state.notes.filter(
          (n) =>
            getNoteDisplayName(n.main).toLowerCase().includes(q) ||
            n.main.toLowerCase().includes(q),
        );

        const list = document.getElementById("noteList");
        list.innerHTML = visible
          .map(
            (n) =>
              `<button class="note-button ${n.id === state.selectedId ? "active" : ""}" onclick="selectNote(${n.id})" style="display:flex; align-items:center; justify-content:center;">${getNoteDisplayHTML(n.main)}</button>`,
          )
          .join("");

        const note = state.notes.find((n) => n.id === state.selectedId);
        if (note) {
          document.getElementById("selectedNote").textContent =
            getNoteDisplayName(note.main);
          document.getElementById("staffContainer").innerHTML = createStaffSVG(
            note.main,
            "large",
          );

          document.getElementById("diagram").innerHTML = buildInstrumentSVG(note);

          document.getElementById("stateRows").innerHTML = state.holes
            .map((h) => {
              const val = (note.values[h.index] || "").toUpperCase();
              const stateName =
                val === "C" ? "Closed" : val === "H" ? "Half" : "Open";
              return `<tr><td>${h.name}</td><td>${stateName}</td></tr>`;
            })
            .join("");
        }
      }

      function selectNote(id) {
        state.selectedId = id;
        render();
      }

      document.getElementById("searchInput").addEventListener("input", (e) => {
        state.query = e.target.value;
        render();
      });

      document
        .getElementById("notationToggle")
        .addEventListener("change", (e) => {
          state.notation = e.target.value;
          render();
        });

      document
        .getElementById("displayToggle")
        .addEventListener("change", (e) => {
          state.display = e.target.value;
          render();
        });

      const modelSelect = document.getElementById("modelSelect");
      modelSelect.innerHTML = MODELS.map(
        (m) => `<option value="${m.id}">${m.label}</option>`,
      ).join("");
      modelSelect.addEventListener("change", (e) => {
        loadModel(e.target.value);
      });

      // Resizable sidebar: drag the divider, or focus it and use arrow
      // keys. Width persists in localStorage and clamps to 240..520 px.
      const SIDEBAR_MIN = 240;
      const SIDEBAR_MAX = 520;

      function applySidebarWidth(px) {
        const w = Math.round(
          Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, px)));
        document.documentElement.style.setProperty("--sidebar-w", w + "px");
        try {
          localStorage.setItem("sidebarW", String(w));
        } catch (e) {
          /* storage unavailable; width still applies for this session */
        }
        return w;
      }

      const resizer = document.getElementById("sidebarResizer");
      resizer.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        resizer.setPointerCapture(e.pointerId);
        resizer.classList.add("active");
        const startX = e.clientX;
        const startW = document
          .querySelector(".sidebar")
          .getBoundingClientRect().width;
        const move = (ev) => applySidebarWidth(startW + ev.clientX - startX);
        const up = (ev) => {
          resizer.releasePointerCapture(ev.pointerId);
          resizer.classList.remove("active");
          resizer.removeEventListener("pointermove", move);
          resizer.removeEventListener("pointerup", up);
        };
        resizer.addEventListener("pointermove", move);
        resizer.addEventListener("pointerup", up);
      });
      resizer.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        const current =
          parseFloat(
            getComputedStyle(document.documentElement)
              .getPropertyValue("--sidebar-w")) || 300;
        applySidebarWidth(current + (e.key === "ArrowRight" ? 16 : -16));
        e.preventDefault();
      });

      try {
        const saved = parseFloat(localStorage.getItem("sidebarW"));
        if (saved >= SIDEBAR_MIN && saved <= SIDEBAR_MAX) {
          document.documentElement.style.setProperty("--sidebar-w", saved + "px");
        }
      } catch (e) {
        /* no stored width; default 300px stands */
      }

      loadModel(MODELS[0].id);
    </script>
  </body>
